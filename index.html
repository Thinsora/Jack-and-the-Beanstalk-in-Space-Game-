<script>
(function () {
  const moon = document.querySelector("#moon");
  if (!moon || moon.dataset.cratersGenerated) return;

  function generateCraters() {
    if (moon.dataset.cratersGenerated) return;
    moon.dataset.cratersGenerated = "true";

    const THREE = AFRAME.THREE;
    const R = 97.5;
    let seed = 20261121;
    function random() {
      seed = (seed * 1664525 + 1013904223) % 4294967296;
      return seed / 4294967296;
    }

    const maria = [
      { x: 0.15, y: 0.25, z: 0.95, size: 0.42 },
      { x: -0.45, y: 0.35, z: 0.82, size: 0.24 },
      { x: 0.55, y: -0.15, z: 0.82, size: 0.20 },
      { x: -0.10, y: -0.65, z: 0.75, size: 0.18 },
      { x: 0.15, y: 0.25, z: -0.95, size: 0.12 }
    ];

    const pitMaterials = ["#686868", "#747474", "#808080", "#898989", "#929292"]
      .map(color => new THREE.MeshStandardMaterial({
        color, roughness: 1, metalness: 0, side: THREE.DoubleSide
      }));
    const rimMaterial = new THREE.MeshStandardMaterial({
      color: "#D0D0D0", roughness: 1, metalness: 0, side: THREE.DoubleSide
    });

    const count = 420;
    for (let i = 0; i < count; i++) {
      const y = 1 - 2 * (i + random()) / count;
      const angle = i * Math.PI * (3 - Math.sqrt(5)) + (random() - 0.5) * 0.12;
      const ring = Math.sqrt(1 - y * y);
      const normal = new THREE.Vector3(
        Math.cos(angle) * ring, y, Math.sin(angle) * ring
      ).normalize();

      let density = 1;
      for (const sea of maria) {
        const center = new THREE.Vector3(sea.x, sea.y, sea.z).normalize();
        const distance = normal.angleTo(center);
        if (distance < sea.size) {
          density *= 0.12 + 0.88 * Math.min(1, distance / sea.size);
        }
      }
      if (random() > density) continue;

      const type = random();
      const size = type < 0.08 ? 9 + random() * 7
        : type < 0.35 ? 4 + random() * 5
        : 1.5 + random() * 3.5;

      const crater = new THREE.Group();
      crater.position.copy(normal.clone().multiplyScalar(R + 0.08));
      crater.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);

      const pit = new THREE.Mesh(
        new THREE.SphereGeometry(size, 12, 8),
        pitMaterials[Math.floor(random() * pitMaterials.length)]
      );
      pit.scale.set(1, 1, 0.055);
      crater.add(pit);

      const rim = new THREE.Mesh(
        new THREE.TorusGeometry(size * 0.94, Math.max(0.12, size * 0.055), 6, 24),
        rimMaterial
      );
      rim.position.z = 0.08;
      crater.add(rim);
      moon.object3D.add(crater);
    }
  }

  if (moon.hasLoaded) generateCraters();
  else moon.addEventListener("loaded", generateCraters, { once: true });
})();
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const scene = document.querySelector("#world");

  // --- Procedural Web Audio API Synthesizer (zero external files) ---
  let audioCtx = null;
  let alarmInterval = null;

  function ensureAudio() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) audioCtx = new AudioContext();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  function playTone(freq, duration, type = "sine", volume = 0.08, endFreq = null) {
    const ctx = ensureAudio();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, ctx.currentTime + duration);
    gain.gain.setValueAtTime(volume, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  }

  function playHoverChime() {
    playTone(660, 0.12, "sine", 0.04, 880);
  }

  function playLockedBuzz() {
    playTone(140, 0.22, "sawtooth", 0.06, 95);
  }

  // A crisp electronic laser burst whenever the player fires (hit or miss).
  function playBlasterFireSound() {
    playTone(980, 0.075, "sawtooth", 0.065, 260);
    setTimeout(() => playTone(420, 0.11, "square", 0.045, 120), 28);
  }

  // A layered impact / shield-hit sound whenever the Guardian damages the player.
  function playDamageSound() {
    playTone(155, 0.24, "sawtooth", 0.12, 38);
    setTimeout(() => playTone(68, 0.28, "triangle", 0.10, 26), 35);
    setTimeout(() => playTone(510, 0.07, "square", 0.045, 90), 8);
  }

  function playElevatorSound(goingUp, durationMs) {
    const dur = durationMs / 1000;
    playTone(goingUp ? 110 : 320, dur, "triangle", 0.07, goingUp ? 360 : 100);
  }

  function playCoreFanfare() {
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      setTimeout(() => playTone(f, 0.35, "sine", 0.09), i * 90);
    });
  }

  function startAlarmSound() {
    if (alarmInterval) return;
    playTone(220, 0.35, "sawtooth", 0.045, 160);
    alarmInterval = setInterval(() => {
      playTone(220, 0.35, "sawtooth", 0.045, 160);
    }, 1100);
  }

  function stopAlarmSound() {
    if (alarmInterval) {
      clearInterval(alarmInterval);
      alarmInterval = null;
    }
  }

  function playVictoryChord() {
    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => {
      setTimeout(() => playTone(f, 0.8, "triangle", 0.08), i * 110);
    });
  }

  scene.addEventListener("loaded", function () {
    // 1. Disable fog & tone-mapping on distant objects in-place (preserving <a-text> ShaderMaterials)
    const visibleGroups = [
      "#moon", "#earth", "#apollo11", "#space-rocket",
      "#space-station", "#saturn", "#jupiter", "#mars", "#neptune"
    ];

    visibleGroups.forEach(selector => {
      const root = document.querySelector(selector);
      if (!root) return;

      root.object3D.traverse(object => {
        if (!object.isMesh || !object.material) return;
        const materials = Array.isArray(object.material) ? object.material : [object.material];
        materials.forEach(mat => {
          if (!mat || mat.type === "ShaderMaterial") return;
          mat.fog = false;
          mat.toneMapped = false;
          mat.needsUpdate = true;
        });
      });
    });

    // 2. Optimized Starfield (1 draw call via THREE.Points on a distant spherical shell)
    const starsEl = document.querySelector("#stars");
    const starCount = 800;
    const positions = new Float32Array(starCount * 3);

    for (let i = 0; i < starCount; i++) {
      const u = Math.random();
      const v = Math.random();
      const theta = 2 * Math.PI * u;
      const phi = Math.acos(2 * v - 1);
      const r = 140 + Math.random() * 120;

      positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
      positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      positions[i * 3 + 2] = r * Math.cos(phi);
    }

    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    const starMat = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 0.7,
      sizeAttenuation: true,
      fog: false,
      toneMapped: false
    });
    starsEl.setObject3D("mesh", new THREE.Points(starGeo, starMat));

    // 2.5. Generate four spiral vines with leaves and tendrils.
    // The geometry is created after the scene is ready to avoid empty-curve errors.
    const vineRoot = document.querySelector("#tower-vine");
    if (vineRoot && !vineRoot.dataset.created) {
      vineRoot.dataset.created = "true";
      const THREE = AFRAME.THREE;
      const height = 26;
      const vineCount = 4;
      const turns = 4.5;
      const vineRadius = 1.15;
      const segments = 500;
      const vineMaterial = new THREE.MeshStandardMaterial({
        color: "#238B35", roughness: 0.8, metalness: 0,
        emissive: "#103D16", emissiveIntensity: 0.25
      });
      const leafMaterial = new THREE.MeshStandardMaterial({
        color: "#39A844", roughness: 0.75, side: THREE.DoubleSide
      });
      const leafLightMaterial = new THREE.MeshStandardMaterial({
        color: "#70C957", roughness: 0.8, side: THREE.DoubleSide
      });

      for (let v = 0; v < vineCount; v++) {
        const offset = (Math.PI * 2 / vineCount) * v;
        const points = [];
        for (let i = 0; i <= segments; i++) {
          const t = i / segments;
          const angle = t * turns * Math.PI * 2 + offset;
          points.push(new THREE.Vector3(
            Math.cos(angle) * vineRadius, t * height,
            Math.sin(angle) * vineRadius
          ));
        }
        const curve = new THREE.CatmullRomCurve3(points);
        vineRoot.object3D.add(new THREE.Mesh(
          new THREE.TubeGeometry(curve, segments, 0.10, 8, false),
          vineMaterial
        ));

        // Leaves are distributed along every strand, alternating sides.
        for (let i = 0; i < 22; i++) {
          const t = (i + 0.5) / 22;
          const angle = t * turns * Math.PI * 2 + offset;
          const radial = new THREE.Vector3(Math.cos(angle), 0, Math.sin(angle)).normalize();
          const side = i % 2 === 0 ? 1 : -1;
          const outward = radial.clone().multiplyScalar(0.7).add(
            new THREE.Vector3(-Math.sin(angle) * side * 0.8, 0.15,
                              Math.cos(angle) * side * 0.8)
          ).normalize();
          const center = new THREE.Vector3(
            Math.cos(angle) * vineRadius, t * height,
            Math.sin(angle) * vineRadius
          );
          const leafPosition = center.clone().add(outward.clone().multiplyScalar(0.55));
          const leaf = new THREE.Mesh(
            new THREE.SphereGeometry(1, 12, 8),
            i % 3 === 0 ? leafLightMaterial : leafMaterial
          );
          leaf.position.copy(leafPosition);
          leaf.scale.set(0.48 + Math.random() * 0.18, 0.10, 0.24);
          leaf.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), outward);
          vineRoot.object3D.add(leaf);

          const vein = new THREE.Mesh(
            new THREE.CylinderGeometry(0.012, 0.012, 0.65, 5), leafLightMaterial
          );
          vein.position.copy(leafPosition);
          vein.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), outward);
          vineRoot.object3D.add(vein);
        }

        // Small curling tendrils along each main vine.
        for (let i = 0; i < 10; i++) {
          const t = (i + 0.5) / 10;
          const angle = t * turns * Math.PI * 2 + offset;
          const start = new THREE.Vector3(
            Math.cos(angle) * vineRadius, t * height,
            Math.sin(angle) * vineRadius
          );
          const curlPoints = [];
          for (let j = 0; j <= 20; j++) {
            const u = j / 20;
            const a = u * Math.PI * 2;
            curlPoints.push(new THREE.Vector3(
              start.x + Math.cos(angle + a) * 0.3 * u,
              start.y + 0.35 * u,
              start.z + Math.sin(angle + a) * 0.3 * u
            ));
          }
          const curlCurve = new THREE.CatmullRomCurve3(curlPoints);
          vineRoot.object3D.add(new THREE.Mesh(
            new THREE.TubeGeometry(curlCurve, 24, 0.025, 5, false),
            vineMaterial
          ));
        }
      }
    }

    // 3. VR-only fuse cursor so desktop mouse clicks aren't interrupted
    const gazeCursor = document.querySelector("#gaze-cursor");
    scene.addEventListener("enter-vr", () => gazeCursor.setAttribute("fuse", "true"));
    scene.addEventListener("exit-vr", () => gazeCursor.setAttribute("fuse", "false"));

    // 4. Interaction, Gameplay Loop, Live Altitude & Camera Toggle
    const cameraRig = document.querySelector("#camera-rig");
    const hud = document.querySelector("#hud-message");
    const ascendPad = document.querySelector("#ascend-pad");
    const returnPad = document.querySelector("#return-pad");
    const returnBase = document.querySelector("#return-base");
    const returnRingOuter = document.querySelector("#return-ring-outer");
    const returnRingInner = document.querySelector("#return-ring-inner");
    const returnLabel = document.querySelector("#return-label");
    const goldenCore = document.querySelector("#golden-core");
    const jack = document.querySelector("#jack");
    const jackTrophy = document.querySelector("#jack-trophy");
    const guardian = document.querySelector("#guardian");
    const guardianPatrol = document.querySelector("#guardian-patrol");
    const guardianCore = document.querySelector("#guardian-core");
    const guardianEyeL = document.querySelector("#guardian-eye-l");
    const guardianEyeR = document.querySelector("#guardian-eye-r");
    const cityLight = document.querySelector("#city-light");
    const pulseBlasterPickup = document.querySelector("#pulse-blaster-pickup");
    const ammoHud = document.querySelector("#ammo-hud");
    const ammoHudCount = document.querySelector("#ammo-hud-count");
    const ammoDots = Array.from(document.querySelectorAll(".ammo-dot"));
    const gameOverOverlay = document.querySelector("#game-over-overlay");
    const retryButton = document.querySelector("#retry-button");
    const guardianChestLights = [
      document.querySelector("#guardian-chest-light-1"),
      document.querySelector("#guardian-chest-light-2"),
      document.querySelector("#guardian-chest-light-3")
    ];
    const mouseCursor = document.querySelector("#mouse-cursor");

    let isTravelling = false;
    let hasCollectedCore = false;
    let missionComplete = false;
    let isOverview = false;
    let hasPulseBlaster = false;
    let ammoRemaining = 5;
    let isGameOver = false;
    let lastHandledInteractionAt = 0;
    let guardianHits = 0;
    let guardianStunned = false;
    let guardianStunPending = false;
    let guardianStunTimer = null;
    let guardianStunDelayTimer = null;
    let guardianBlinkInterval = null;
    let guardianRetaliationInterval = null;
    const HITS_TO_STUN = 3;
    const STUN_DURATION = 9000;
    let savedPos = { x: 0, y: 0, z: 7 };
    let defaultMessage = "FIND THE PULSE BLASTER NEAR THE TOWER";
    let altitudeRaf = null;

    // The Guardian runs around the cloud city in an evasive, zig-zagging route.
    // The Golden Core remains attached to its hand because it is nested inside it.
    const guardianLegL = document.querySelector("#guardian-leg-l");
    const guardianLegR = document.querySelector("#guardian-leg-r");
    const guardianArmL = document.querySelector("#guardian-arm-l");
    const guardianArmR = document.querySelector("#guardian-arm-r");

    [guardianLegL, guardianLegR, guardianArmL, guardianArmR].forEach((limb) => {
      limb.setAttribute("animation__run", {
        property: "rotation",
        from: limb === guardianLegL || limb === guardianArmR ? "38 0 0" : "-38 0 0",
        to: limb === guardianLegL || limb === guardianArmR ? "-38 0 0" : "38 0 0",
        dur: 260,
        dir: "alternate",
        loop: true,
        easing: "linear"
      });
    });

    function animateGuardianPatrol(timestamp) {
      if (guardianStunned || guardianStunPending || isGameOver) {
        requestAnimationFrame(animateGuardianPatrol);
        return;
      }
      const t = timestamp * 0.00062;
      const x = Math.cos(t) * 4.1 + Math.sin(t * 2.7) * 0.75;
      const z = -5 + Math.sin(t) * 2.8 + Math.cos(t * 3.1) * 0.55;
      const y = Math.abs(Math.sin(t * 5.4)) * 0.28;
      guardianPatrol.object3D.position.set(x, y, z);

      // Face the direction of travel so the Guardian appears to sprint away.
      const dx = -4.1 * Math.sin(t) + 2.025 * Math.cos(t * 2.7);
      const dz = 2.8 * Math.cos(t) - 1.705 * Math.sin(t * 3.1);
      guardianPatrol.object3D.rotation.y = Math.atan2(-dx, -dz);
      requestAnimationFrame(animateGuardianPatrol);
    }
    requestAnimationFrame(animateGuardianPatrol);
    installEmptyClickAmmoHandler();
    startGuardianRetaliation();

    function markHandledInteraction() {
      lastHandledInteractionAt = Date.now();
    }

    function setChestLights(mode, litCount = 3) {
      guardianChestLights.forEach((light, index) => {
        if (!light) return;
        if (mode === "off" || (mode === "progress" && index < litCount)) {
          light.setAttribute("color", "#17212D");
          light.setAttribute("material", "emissive:#000000;emissiveIntensity:0");
        } else if (mode === "red") {
          light.setAttribute("color", "#FF263D");
          light.setAttribute("material", "emissive:#FF001E;emissiveIntensity:4");
        } else {
          light.setAttribute("color", "#00EFFF");
          light.setAttribute("material", "emissive:#00DFFF;emissiveIntensity:3");
        }
      });
    }

    function updateAmmoHud() {
      if (!hasPulseBlaster) return;
      ammoHud.style.display = "block";
      ammoHudCount.textContent = `AMMO: ${ammoRemaining} / 5`;
      ammoDots.forEach((dot, index) => dot.classList.toggle("spent", index >= ammoRemaining));
    }

    function triggerGameOver() {
      if (isGameOver) return;
      isGameOver = true;
      stopAlarmSound();
      if (guardianStunTimer) clearTimeout(guardianStunTimer);
      if (guardianStunDelayTimer) clearTimeout(guardianStunDelayTimer);
      if (guardianBlinkInterval) clearInterval(guardianBlinkInterval);
      if (guardianRetaliationInterval) clearInterval(guardianRetaliationInterval);
      gameOverOverlay.style.display = "flex";
      // Disable all world interactions while leaving the HTML RETRY button usable.
      document.querySelectorAll(".clickable").forEach((el) => el.classList.remove("clickable"));
      if (scene.canvas) scene.canvas.style.pointerEvents = "none";
      const gazeRaycaster = document.querySelector("#gaze-cursor");
      if (gazeRaycaster) gazeRaycaster.setAttribute("raycaster", "enabled", false);
      if (mouseCursor) mouseCursor.setAttribute("raycaster", "enabled", false);
    }

    function consumeAmmo(reason) {
      if (!hasPulseBlaster || isGameOver || ammoRemaining <= 0) return false;
      ammoRemaining = Math.max(0, ammoRemaining - 1);
      updateAmmoHud();
      // A shot is audible for both a successful Guardian hit and an empty-space miss.
      if (reason === "hit" || reason === "miss") playBlasterFireSound();
      if (reason === "miss") {
        showMessage("SHOT MISSED — AMMO -1", false, "#FFCC77");
      } else if (reason === "retaliation") {
        playDamageSound();
        showMessage("GUARDIAN COUNTERATTACK — AMMO -1", false, "#FF7777");
      }
      if (ammoRemaining === 0) {
        triggerGameOver();
        return false;
      }
      return true;
    }

    function isPlayerInCloudCity() {
      const p = cameraRig.object3D.position;
      const dx = p.x;
      const dz = p.z + 5;
      return p.y >= 22 && p.y <= 36 && Math.sqrt(dx * dx + dz * dz) <= 13;
    }

    function startGuardianRetaliation() {
      if (guardianRetaliationInterval) clearInterval(guardianRetaliationInterval);
      guardianRetaliationInterval = setInterval(() => {
        if (isGameOver || !hasPulseBlaster || hasCollectedCore || guardianStunned || guardianStunPending || isTravelling) return;
        if (!isPlayerInCloudCity()) return;
        consumeAmmo("retaliation");
      }, 7000);
    }

    // Empty-space/background clicks consume one shot. Clicks on existing game objects
    // are exempt; Guardian clicks are charged by the Guardian handler itself.
    function installEmptyClickAmmoHandler() {
      const canvas = scene.canvas;
      if (!canvas) return;
      canvas.addEventListener("click", () => {
        if (!hasPulseBlaster || isGameOver) return;
        setTimeout(() => {
          if (isGameOver || Date.now() - lastHandledInteractionAt < 140) return;
          const raycaster = mouseCursor && mouseCursor.components && mouseCursor.components.raycaster;
          const intersections = raycaster && raycaster.intersectedEls ? raycaster.intersectedEls : [];
          const hitExistingClickable = intersections.some((el) => el && el.classList && el.classList.contains("clickable"));
          if (hitExistingClickable) return;
          consumeAmmo("miss");
        }, 0);
      });
    }

    retryButton.addEventListener("click", () => window.location.reload());

    function showMessage(message, setAsDefault = false, color = "#FFFFFF") {
      if (setAsDefault) defaultMessage = message;
      hud.setAttribute("value", message);
      hud.setAttribute("color", color);
    }

    function updateAltitudeHUD(label) {
      if (!isTravelling) return;
      const y = Math.max(0, cameraRig.object3D.position.y);
      const altMeters = Math.round((y / 26.3) * 35786);
      hud.setAttribute("value", `${label} | ALTITUDE: ${altMeters.toLocaleString()} m`);
      altitudeRaf = requestAnimationFrame(() => updateAltitudeHUD(label));
    }

    function travelTo(x, y, z, duration, travelLabel, onArrive) {
      if (isTravelling) return;
      isTravelling = true;
      isOverview = false;
      const goingUp = y > cameraRig.object3D.position.y;
      playElevatorSound(goingUp, duration);
      cameraRig.removeAttribute("animation__travel");

      const onFinish = function () {
        cameraRig.removeAttribute("animation__travel");
        cameraRig.removeEventListener("animationcomplete__travel", onFinish);
        if (altitudeRaf) cancelAnimationFrame(altitudeRaf);
        isTravelling = false;
        if (onArrive) onArrive();
      };

      cameraRig.addEventListener("animationcomplete__travel", onFinish);
      cameraRig.setAttribute("animation__travel", {
        property: "position",
        to: `${x} ${y} ${z}`,
        dur: duration,
        easing: "easeInOutQuad"
      });
      updateAltitudeHUD(travelLabel);
    }

    ascendPad.addEventListener("click", function () {
      markHandledInteraction();
      if (isGameOver) return;
      travelTo(0, 26.3, -0.2, 8000, "ASCENDING", () => {
        if (hasCollectedCore && !missionComplete) {
          showMessage("ALERT! ESCAPE TO THE RETURN PAD!", true, "#FF6B6B");
        } else {
          showMessage("ORBITAL CLOUD CITY — FIND THE GOLDEN CORE", true, "#FFFFFF");
        }
      });
    });

    returnPad.addEventListener("click", function () {
      markHandledInteraction();
      if (isGameOver || isTravelling) return;
      if (!hasCollectedCore) {
        playLockedBuzz();
        showMessage("RETURN PORTAL LOCKED — COLLECT THE GOLDEN CORE FIRST!", false, "#FF6B6B");
        return;
      }
      stopAlarmSound();
      travelTo(0, 0, 7, 7000, "DESCENDING", () => {
        if (!missionComplete) {
          missionComplete = true;
          jackTrophy.setAttribute("visible", "true");
          playVictoryChord();
          showMessage("MISSION COMPLETE! JACK HAS THE GOLDEN CORE!", true, "#FFD700");
        } else {
          showMessage("WELCOME BACK TO THE FLOATING ISLAND", true, "#FFFFFF");
        }
      });
    });

    function playPulseSound() {
      playTone(520, 0.16, "square", 0.07, 150);
    }

    function showPulseBeam() {
      const THREE = AFRAME.THREE;
      const camera = document.querySelector("#main-camera");
      camera.object3D.updateMatrixWorld(true);
      guardian.object3D.updateMatrixWorld(true);
      const start = new THREE.Vector3();
      camera.object3D.getWorldPosition(start);
      const end = guardian.object3D.localToWorld(new THREE.Vector3(0, 29, -5));
      const geometry = new THREE.BufferGeometry().setFromPoints([start, end]);
      const material = new THREE.LineBasicMaterial({ color: 0x62efff, transparent: true, opacity: 0.95 });
      const beam = new THREE.Line(geometry, material);
      scene.object3D.add(beam);
      setTimeout(() => {
        scene.object3D.remove(beam);
        geometry.dispose();
        material.dispose();
      }, 180);
    }

    function setGuardianRunAnimation(enabled) {
      [guardianLegL, guardianLegR, guardianArmL, guardianArmR].forEach((limb) => {
        if (!limb) return;
        if (enabled) {
          limb.setAttribute("animation__run", {
            property: "rotation",
            from: limb === guardianLegL || limb === guardianArmR ? "38 0 0" : "-38 0 0",
            to: limb === guardianLegL || limb === guardianArmR ? "-38 0 0" : "38 0 0",
            dur: 260, dir: "alternate", loop: true, easing: "linear"
          });
        } else {
          limb.removeAttribute("animation__run");
          limb.object3D.rotation.set(0, 0, 0);
        }
      });
    }

    function stunGuardian() {
      guardianStunPending = false;
      guardianStunned = true;
      setChestLights("red");
      if (guardianBlinkInterval) clearInterval(guardianBlinkInterval);
      let redVisible = true;
      guardianBlinkInterval = setInterval(() => {
        if (!guardianStunned || isGameOver) return;
        redVisible = !redVisible;
        guardianChestLights.forEach((light) => {
          if (!light) return;
          light.setAttribute("visible", redVisible);
        });
      }, 300);
      guardian.removeAttribute("animation");
      setGuardianRunAnimation(false);
      guardianEyeL.setAttribute("color", "#FFFFFF");
      guardianEyeR.setAttribute("color", "#FFFFFF");
      guardianEyeL.setAttribute("material", "emissive:#FFFFFF;emissiveIntensity:5");
      guardianEyeR.setAttribute("material", "emissive:#FFFFFF;emissiveIntensity:5");
      guardian.setAttribute("animation__stun", {
        property: "rotation", from: "0 0 0", to: "0 0 7", dur: 180, dir: "alternate", loop: 3
      });
      goldenCore.classList.add("clickable");
      showMessage("GUARDIAN STUNNED! CLICK THE GOLDEN CORE NOW!", true, "#FFD700");
      playCoreFanfare();

      guardianStunTimer = setTimeout(() => {
        if (hasCollectedCore) return;
        guardianStunned = false;
        guardianHits = 0;
        if (guardianBlinkInterval) clearInterval(guardianBlinkInterval);
        guardianBlinkInterval = null;
        guardianChestLights.forEach((light) => light && light.setAttribute("visible", "true"));
        setChestLights("blue");
        goldenCore.classList.remove("clickable");
        guardian.removeAttribute("animation__stun");
        guardian.object3D.rotation.set(0, 0, 0);
        guardian.setAttribute("animation", {
          property: "position", from: "0 0 0", to: "0 0.13 0", dur: 2400, dir: "alternate", loop: true, easing: "easeInOutSine"
        });
        setGuardianRunAnimation(true);
        guardianEyeL.setAttribute("color", "#FF2222");
        guardianEyeR.setAttribute("color", "#FF2222");
        guardianEyeL.setAttribute("material", "emissive:#FF0000;emissiveIntensity:4");
        guardianEyeR.setAttribute("material", "emissive:#FF0000;emissiveIntensity:4");
        showMessage("THE GUARDIAN ESCAPED! HIT IT 3 TIMES AGAIN!", true, "#FF7777");
      }, STUN_DURATION);
    }

    pulseBlasterPickup.addEventListener("click", function () {
      markHandledInteraction();
      if (isGameOver || hasPulseBlaster) return;
      hasPulseBlaster = true;
      updateAmmoHud();
      playCoreFanfare();
      pulseBlasterPickup.classList.remove("clickable");
      pulseBlasterPickup.setAttribute("animation__pickup", {
        property: "scale", to: "0 0 0", dur: 550, easing: "easeInBack"
      });
      setTimeout(() => pulseBlasterPickup.setAttribute("visible", "false"), 600);
      showMessage("PULSE BLASTER ACQUIRED! CLICK THE GUARDIAN TO FIRE — 3 HITS TO STUN!", true, "#9CEBFF");
    });

    guardian.addEventListener("click", function () {
      markHandledInteraction();
      if (isGameOver || hasCollectedCore || missionComplete) return;
      if (!hasPulseBlaster) {
        showMessage("YOU NEED THE PULSE BLASTER NEAR THE TOWER FIRST!", false, "#FFCC77");
        return;
      }
      if (guardianStunned || guardianStunPending) {
        showMessage("QUICK! THE GUARDIAN IS STUNNED — TAKE THE GOLDEN CORE!", false, "#FFD700");
        return;
      }
      if (!consumeAmmo("hit")) return;
      guardianHits = Math.min(HITS_TO_STUN, guardianHits + 1);
      setChestLights("progress", guardianHits);
      playPulseSound();
      showPulseBeam();
      const hitFlash = document.createElement("a-sphere");
      hitFlash.setAttribute("position", "0 29 -4.15");
      hitFlash.setAttribute("radius", "0.65");
      hitFlash.setAttribute("color", "#62EFFF");
      hitFlash.setAttribute("material", "emissive:#00DFFF;emissiveIntensity:4;transparent:true;opacity:0.8");
      guardian.appendChild(hitFlash);
      hitFlash.setAttribute("animation__flash", { property: "scale", from: "0.2 0.2 0.2", to: "2.4 2.4 2.4", dur: 280, easing: "easeOutQuad" });
      setTimeout(() => hitFlash.remove(), 320);

      if (guardianHits >= HITS_TO_STUN) {
        // The third chest light goes dark immediately; red synchronized blinking
        // and the 9-second stun begin exactly one second later.
        guardianStunPending = true;
        guardian.removeAttribute("animation");
        setGuardianRunAnimation(false);
        if (guardianStunDelayTimer) clearTimeout(guardianStunDelayTimer);
        guardianStunDelayTimer = setTimeout(() => {
          if (!hasCollectedCore && !isGameOver) stunGuardian();
        }, 1000);
        showMessage("GUARDIAN SYSTEMS FAILING...", true, "#9CEBFF");
      } else {
        showMessage(`PULSE HIT ${guardianHits}/${HITS_TO_STUN} — KEEP FIRING!`, false, "#9CEBFF");
      }
    });

    goldenCore.addEventListener("click", function () {
      markHandledInteraction();
      if (isGameOver || hasCollectedCore) return;
      if (!guardianStunned) {
        showMessage("THE GOLDEN CORE IS PROTECTED! STUN THE GUARDIAN FIRST!", false, "#FF7777");
        return;
      }
      if (guardianStunTimer) clearTimeout(guardianStunTimer);
      if (guardianStunDelayTimer) clearTimeout(guardianStunDelayTimer);
      if (guardianBlinkInterval) clearInterval(guardianBlinkInterval);
      guardianBlinkInterval = null;
      guardianStunPending = false;
      hasCollectedCore = true;
      guardianStunned = false;
      guardianChestLights.forEach((light) => light && light.setAttribute("visible", "true"));
      setChestLights("blue");
      if (guardianStunTimer) clearTimeout(guardianStunTimer);
      guardian.removeAttribute("animation__stun");
      guardian.object3D.rotation.set(0, 0, 0);
      playCoreFanfare();

      // Shrink & hide the Golden Core
      goldenCore.removeAttribute("animation__pulse");
      goldenCore.classList.remove("clickable");
      goldenCore.setAttribute("animation__collect", {
        property: "scale",
        to: "0 0 0",
        dur: 1000,
        easing: "easeInBack"
      });
      document.querySelector("#core-ring").setAttribute("visible", "false");
      document.querySelector("#core-label").setAttribute("visible", "false");
      setTimeout(() => goldenCore.setAttribute("visible", "false"), 1100);

      // Unlock & power up the Return Pad
      returnBase.setAttribute("color", "#35D68A");
      returnBase.setAttribute("material", "emissive:#00CC77;emissiveIntensity:2");
      returnRingOuter.setAttribute("color", "#B9FFDA");
      returnRingOuter.setAttribute("material", "emissive:#00FF99;emissiveIntensity:2");
      returnRingInner.setAttribute("visible", "true");
      returnLabel.setAttribute("value", "RETURN");
      returnLabel.setAttribute("color", "#8DFFC7");

      // Trigger Guardian Alarm State
      guardianEyeL.setAttribute("color", "#FF2222");
      guardianEyeL.setAttribute("material", "emissive:#FF0000;emissiveIntensity:4");
      guardianEyeR.setAttribute("color", "#FF2222");
      guardianEyeR.setAttribute("material", "emissive:#FF0000;emissiveIntensity:4");
      guardianCore.setAttribute("color", "#FF2222");
      guardianCore.setAttribute("material", "emissive:#FF0000;emissiveIntensity:4");
      cityLight.setAttribute("color", "#FF4444");

      showMessage("RETURN PORTAL UNLOCKED! ESCAPE FROM THE GUARDIAN!", true, "#FF6B6B");
      setTimeout(startAlarmSound, 450);
    });

    // Clickable lore captions
    jack.addEventListener("click", function () {
      markHandledInteraction();
      if (isGameOver) return;
      playHoverChime();
      const msg = missionComplete
        ? "JACK: \"WE MADE IT BACK WITH THE GOLDEN CORE!\""
        : "JACK: \"TAKE THE ASCEND PORTAL UP THE SPACE ELEVATOR!\"";
      showMessage(msg, false, "#D9F5E8");
    });

    // Press V to toggle wide cinematic overview
    window.addEventListener("keydown", function (e) {
      if (e.key.toLowerCase() !== "v" || isTravelling) return;
      if (!isOverview) {
        const p = cameraRig.object3D.position;
        savedPos = { x: p.x, y: p.y, z: p.z };
        cameraRig.setAttribute("position", "0 14 28");
        isOverview = true;
        showMessage("OVERVIEW MODE (PRESS V TO RETURN)", false, "#9CEBFF");
      } else {
        cameraRig.setAttribute("position", `${savedPos.x} ${savedPos.y} ${savedPos.z}`);
        isOverview = false;
        showMessage(defaultMessage, false, "#FFFFFF");
      }
    });

    function addButtonEffects(button) {
      button.addEventListener("mouseenter", function () {
        if (isGameOver || isTravelling) return;
        if (button === returnPad && !hasCollectedCore) {
          showMessage("LOCKED — COLLECT THE GOLDEN CORE TO UNLOCK", false, "#FF8888");
          return;
        }
        playHoverChime();
        button.setAttribute("scale", "1.12 1.12 1.12");
        showMessage("CLICK TO ACTIVATE", false, "#80DFFF");
      });
      button.addEventListener("mouseleave", function () {
        if (isGameOver) return;
        button.setAttribute("scale", "1 1 1");
        showMessage(defaultMessage, false, hasCollectedCore && !missionComplete ? "#FF6B6B" : "#FFFFFF");
      });
    }

    addButtonEffects(ascendPad);
    addButtonEffects(returnPad);
    setChestLights("blue");
    ammoHud.style.display = "none";
    showMessage(defaultMessage, true);
  });
});
</script>

</body>
</html>
